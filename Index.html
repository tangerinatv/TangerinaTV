<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tangerina TV</title>

    <meta name="description" content="Tangerina TV">
    <meta name="theme-color" content="#0b0f14">

    <style>

        /* =========================
           RESET
           ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(255, 102, 0, 0.10) 0%,
                    rgba(255, 102, 0, 0.035) 22%,
                    transparent 48%
                ),
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 150, 0, 0.06),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #05070a 0%,
                    #0a0f15 45%,
                    #070a0e 100%
                );

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            color: white;
        }


        /* =========================
           FUNDO
           ========================= */

        .background {
            position: fixed;
            inset: 0;

            overflow: hidden;
            pointer-events: none;

            z-index: 0;
        }


        /* =========================
           BRILHO CENTRAL
           ========================= */

        .glow {
            position: absolute;

            width: 600px;
            height: 600px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            background: radial-gradient(
                circle,
                rgba(255, 94, 0, 0.10) 0%,
                rgba(255, 94, 0, 0.035) 30%,
                transparent 70%
            );

            filter: blur(20px);
        }


        /* =========================
           BOLHAS
           ========================= */

        .bubble {
            position: absolute;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.025);

            border: 1px solid rgba(255, 255, 255, 0.055);

            box-shadow:
                inset 0 0 8px rgba(255, 255, 255, 0.025),
                0 0 12px rgba(255, 90, 0, 0.025);

            animation:
                float linear infinite,
                pulse ease-in-out infinite alternate;
        }

        .bubble.orange {
            background: rgba(255, 90, 0, 0.035);
            border-color: rgba(255, 110, 0, 0.08);
        }


        /* =========================
           ANIMAÇÃO DAS BOLHAS
           ========================= */

        @keyframes float {

            0% {
                transform: translateY(110vh) translateX(0);
            }

            100% {
                transform: translateY(-120vh) translateX(40px);
            }
        }


        @keyframes pulse {

            from {
                opacity: 0.25;
            }

            to {
                opacity: 0.65;
            }
        }


        /* =========================
           CONTEÚDO
           ========================= */

        .container {
            position: relative;
            z-index: 10;

            width: 100%;
            max-width: 1200px;

            padding: 40px 30px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
        }


        /* =========================
           LOGO
           ========================= */

        .logo-wrapper {
            width: min(70vw, 700px);

            animation: logoAppear 1.4s ease-out forwards;

            filter:
                drop-shadow(0 0 8px rgba(255, 90, 0, 0.25))
                drop-shadow(0 15px 40px rgba(0, 0, 0, 0.6));
        }

        .logo {
            width: 100%;
            height: auto;
            display: block;
        }


        @keyframes logoAppear {

            0% {
                opacity: 0;

                transform: scale(0.90);

                filter:
                    blur(10px)
                    drop-shadow(0 0 0 transparent);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }


        /* =========================
           LINHA DECORATIVA
           ========================= */

        .line {
            width: 180px;
            height: 2px;

            margin-top: 24px;

            background: linear-gradient(
                90deg,
                transparent,
                #ff6500,
                #ff9d32,
                #ff6500,
                transparent
            );

            box-shadow:
                0 0 12px rgba(255, 100, 0, 0.5);

            animation:
                lineAppear 1.5s ease-out 0.5s both;
        }


        @keyframes lineAppear {

            from {
                width: 0;
                opacity: 0;
            }

            to {
                width: 180px;
                opacity: 1;
            }
        }


        /* =========================
           TEXTO
           ========================= */

        .subtitle {
            margin-top: 18px;

            font-size: clamp(12px, 1.4vw, 18px);

            letter-spacing: 5px;

            color: rgba(255, 255, 255, 0.55);

            text-transform: uppercase;

            animation:
                textAppear 1.5s ease-out 0.8s both;
        }


        @keyframes textAppear {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
           INDICADOR
           ========================= */

        .status {
            margin-top: 25px;

            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 12px;

            color: rgba(255,255,255,0.35);

            animation:
                textAppear 1.5s ease-out 1.1s both;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #ff6500;

            box-shadow:
                0 0 6px #ff6500,
                0 0 14px rgba(255, 100, 0, 0.6);

            animation: statusPulse 1.8s infinite;
        }


        @keyframes statusPulse {

            0%,
            100% {
                opacity: 0.5;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.15);
            }
        }


        /* =========================
           BOTÕES MOL
           ========================= */

        .mol-buttons {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 24px;

            width: 100%;

            margin-top: 35px;

            animation:
                textAppear 1.5s ease-out 1.3s both;
        }


        .mol-button {
            display: block;

            width: 190px;
            height: 115px;

            padding: 8px;

            border-radius: 16px;

            overflow: hidden;

            background: rgba(255, 255, 255, 0.035);

            border: 1px solid rgba(255, 100, 0, 0.20);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.35),
                0 0 15px rgba(255, 90, 0, 0.08);

            transition:
                transform 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;
        }


        .mol-button img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;

            border-radius: 10px;
        }


        /* =========================
           HOVER DOS BOTÕES
           ========================= */

        .mol-button:hover {
            transform: translateY(-7px) scale(1.03);

            background: rgba(255, 100, 0, 0.06);

            border-color: rgba(255, 100, 0, 0.70);

            box-shadow:
                0 14px 35px rgba(0, 0, 0, 0.50),
                0 0 28px rgba(255, 90, 0, 0.25);
        }


        .mol-button:active {
            transform: translateY(-2px) scale(0.98);
        }


        /* =========================
           ACESSIBILIDADE
           ========================= */

        .mol-button:focus-visible {
            outline: 2px solid #ff9d32;
            outline-offset: 5px;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            .container {
                padding: 30px 20px;
            }


            .logo-wrapper {
                width: 82vw;
                max-width: 500px;
            }


            .line {
                margin-top: 18px;
            }


            .subtitle {
                letter-spacing: 3px;
                font-size: 10px;
            }


            .status {
                margin-top: 20px;
            }


            .mol-buttons {
                gap: 10px;
                margin-top: 28px;
            }


            .mol-button {
                width: 29vw;
                height: 82px;

                padding: 5px;

                border-radius: 12px;
            }


            .mol-button img {
                border-radius: 8px;
            }

        }


        /* =========================
           ECRÃS MUITO PEQUENOS
           ========================= */

        @media (max-width: 380px) {

            .container {
                padding: 20px 15px;
            }


            .logo-wrapper {
                width: 86vw;
            }


            .mol-buttons {
                gap: 7px;
                margin-top: 22px;
            }


            .mol-button {
                width: 30vw;
                height: 70px;

                padding: 4px;
            }

        }


        /* =========================
           REDUZIR ANIMAÇÕES
           ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

        }

    </style>

</head>
